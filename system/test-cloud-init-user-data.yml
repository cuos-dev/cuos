#cloud-config
hostname: example-host
update_registry: "https://update.shieldor.com/v2"
update_registry_user: "update_user"
update_registry_password: "secure_password"

network:
  version: 2
  config:
    - type: physical
      name: eth0
      dhcp4: true
    - type: physical
      name: eth1
      dhcp4: false
      addresses: [ "192.168.1.10/24" ]
      gateway4: "192.168.1.1"
      nameservers:
        addresses: [ "8.8.8.8", "8.8.4.4" ]

ntp:
  servers:
    - "pool.ntp.org"
    - "time.google.com"

it-network-interface-name: "eth0"
ot-network-interface-name: "eth1"

docker_net_prefix: "10.235"
docker_bridge_net: "10.235.255.1/24"
docker_net_space: "10.235.128.0/18"
docker_net_space_size: 26

custom_ca_certs:
  - |
    -----BEGIN CERTIFICATE-----
    MIIDdzCCAl+gAwIBAgIEbG9jYWwwDQYJKoZIhvcNAQELBQAw...
    -----END CERTIFICATE-----

swap_size: 8

initial_image: "myapp/initial"
initial_image_version: "1.0.0"
initial_image_digest: "sha256:abc123"

updater_image: "myapp/updater"
updater_image_version: "1.0.1"
updater_image_digest: "sha256:def456"

os_image: "myos/image"
os_image_version: "2.0.0"
os_image_digest: "sha256:ghi789"
