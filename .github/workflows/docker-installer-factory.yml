name: Build and Push cuos-installer-factory (Multi-Arch)

on:
  push:
    branches:
      - main
      - development
    tags:
      - '*'
    paths:
      - installer-factory/**
      - .github/workflows/docker-installer-factory.yml
  workflow_dispatch:

jobs:
  build-and-push:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: vars
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            TAG=latest
          else
            TAG=${GITHUB_REF#refs/heads/}
            TAG=${TAG//\//-}
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build and push Docker image - cuos-installer-factory
        uses: docker/build-push-action@v6
        with:
          context: ./installer-factory
          file: ./installer-factory/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cuos-installer-factory:${{ steps.vars.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.run_id }}
            org.opencontainers.image.version=${{ steps.vars.outputs.tag }}
          #platforms: linux/amd64,linux/arm64,linux/arm/v7
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/cuos-installer-factory:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/cuos-installer-factory:buildcache,mode=max
