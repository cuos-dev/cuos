name: Build and Push cuos-system (Multi-Arch)

on:
  push:
    branches:
      - main
      - development
    tags:
      - '*'
    paths:
      - system/**
      - .github/workflows/docker-system.yml
  workflow_dispatch:

jobs:
  build-and-push:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: vars
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            TAG=latest
          else
            TAG=${GITHUB_REF#refs/heads/}
            TAG=${TAG//\//-}
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build and push Docker image - cuos-system
        uses: docker/build-push-action@v7
        with:
          context: ./system
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cuos-system:${{ steps.vars.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.run_id }}
            org.opencontainers.image.version=${{ steps.vars.outputs.tag }}
          #platforms: linux/amd64,linux/arm64,linux/arm/v7
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/cuos-system:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/cuos-system:buildcache,mode=max

      - name: Build and push Docker image - cuos-system-rpi-arm64
        uses: docker/build-push-action@v7
        with:
          context: ./system
          file: ./system/Dockerfile.rpi-arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cuos-system-rpi-arm64:${{ steps.vars.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.run_id }}
            org.opencontainers.image.version=${{ steps.vars.outputs.tag }}
          platforms: linux/arm64
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/cuos-system-rpi-arm64:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/cuos-system-rpi-arm64:buildcache,mode=max

      - name: Build and push Docker image - cuos-system-lxc
        uses: docker/build-push-action@v7
        with:
          context: ./system
          file: ./system/Dockerfile.lxc
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cuos-system-lxc:${{ steps.vars.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.run_id }}
            org.opencontainers.image.version=${{ steps.vars.outputs.tag }}
          #platforms: linux/amd64,linux/arm64,linux/arm/v7
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/cuos-system-lxc:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/cuos-system-lxc:buildcache,mode=max
