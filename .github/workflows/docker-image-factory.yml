# SPDX-License-Identifier: Apache-2.0
name: Build and Push cuos-image-factory (Multi-Arch)

on:
  push:
    branches:
      - main
      - development
    tags:
      - '*'
    paths:
      - LICENSE.txt
      - NOTICE
      - image-factory/**
      - updater/lib/**
      - .github/workflows/docker-image-factory.yml
  workflow_dispatch:

jobs:
  build-and-push:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # git describe needs the tags and the history back to them
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: vars
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            TAG=latest
          else
            TAG=${GITHUB_REF#refs/heads/}
            TAG=${TAG//\//-}
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
          echo "version=$(git describe --tags --always)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image - cuos-image-factory
        uses: docker/build-push-action@v7
        with:
          context: ./image-factory
          file: ./image-factory/Dockerfile
          build-contexts: |
            repo=.
            updater=./updater
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cuos-image-factory:${{ steps.vars.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.vars.outputs.created }}
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/cuos-image-factory:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/cuos-image-factory:buildcache,mode=max
